<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduPay — Plateforme SaaS de gestion des paiements scolaires pour les écoles africaines francophones. Gérez les inscriptions, frais et paiements facilement." />
    <meta name="keywords" content="EduPay, paiement scolaire, gestion école, frais scolaires, Afrique, francophone, SaaS éducation" />
    <meta name="author" content="EduPay" />
    <meta name="theme-color" content="#1E3A5F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <title>EduPay — Gestion des Paiements Scolaires</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        fetch('http://localhost:9999/', {
          method: 'POST',
          body: JSON.stringify({ message, source, lineno, colno, error: error ? error.stack : '' })
        }).catch(() => {});
        document.body.innerHTML += '<div style="color:red;padding:20px;z-index:9999;position:absolute;top:0;background:white;width:100%">' + message + '<br/>' + (error ? error.stack : '') + '</div>';
      };
    </script>
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
